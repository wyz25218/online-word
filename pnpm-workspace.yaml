packages:
  - 'apps/*'
  - 'packages/*'

# ADR-05：全仓版本中枢。所有应用内依赖写 "catalog:" 引用，禁止 ^/~。
# 下列版本于 2026-09-22 经 registry 查询核实；M0.4 安装后以 pnpm-lock.yaml 为准回填确认。
# 升级规则：@tiptap/*、yjs、y-protocols、y-prosemirror、@tiptap/y-tiptap、@hocuspocus/*
#          为强耦合组，必须整组升级并重跑 C01-C08 协同回归。
catalog:
  # --- 语言 / 工具链 ---
  typescript: 7.0.2
  tsx: 4.23.15
  '@types/node': 22.20.4

  # --- React（方案基线为 18.3.1，实施时当前稳定线为 19.3，Tiptap v3 peer 已声明支持 ^19） ---
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  vite: 8.3.0
  '@vitejs/plugin-react': 6.1.1

  # --- Yjs / CRDT ---
  yjs: 13.6.32
  y-protocols: 1.0.7
  y-prosemirror: 1.3.7
  y-indexeddb: 9.0.12

  # --- Hocuspocus 协作网关 / 客户端 ---
  '@hocuspocus/server': 4.7.0
  '@hocuspocus/provider': 4.7.0

  # --- Tiptap v3（所有 @tiptap/* 必须同版本；cursor 例外见下） ---
  '@tiptap/react': 3.31.3
  '@tiptap/pm': 3.31.3
  '@tiptap/core': 3.31.3
  '@tiptap/starter-kit': 3.31.3
  '@tiptap/extension-placeholder': 3.31.3
  '@tiptap/extension-collaboration': 3.31.3
  # 注意：该包 npm latest 标签仍指向 2.26.2（v2），v3 正式版必须显式锁定 3.0.0
  '@tiptap/extension-collaboration-cursor': 3.0.0
  # v3 的 y-prosemirror fork，由 collaboration 扩展自动依赖，此处登记以备显式引用
  '@tiptap/y-tiptap': 3.0.9
